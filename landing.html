<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkSync — แพลตฟอร์มซื้อขายออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'IBM Plex Sans Thai', sans-serif;
    background:linear-gradient(135deg, #0d2137 0%, #1a3a5c 50%, #2756a0 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    position:relative;
  }
  /* วงกลมตกแต่งล้นออกนอกจอ จึงต้องมีกล่องตัดของตัวเอง
     ถ้าใส่ overflow:hidden ที่ body ตรง ๆ จะไปตัดพวกเมนูหรือ tooltip ที่ต้องโผล่พ้นขอบด้วย */
  .bg-decor {
    position:fixed; inset:0; overflow:hidden;
    pointer-events:none; z-index:0;
  }
  .blob1 { position:absolute; right:-100px; top:-100px; width:400px; height:400px;
           border-radius:50%; background:rgba(255,92,53,.12); }
  .blob2 { position:absolute; left:-80px; bottom:-80px; width:300px; height:300px;
           border-radius:50%; background:rgba(255,255,255,.05); }

  .card {
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    padding:48px 40px;
    max-width:520px; width:100%;
    text-align:center;
    position:relative; z-index:1;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }

  .logo {
    font-size:42px; font-weight:700; color:#fff;
    letter-spacing:-1px; margin-bottom:8px;
  }
  .logo span { color:#ff5c35; }

  /* ค่า alpha ต่ำกว่า .72 คอนทราสต์ไม่ผ่าน 4.5:1
     เมื่อวัดบน #2756a0 ซึ่งเป็นจุดสว่างที่สุดของพื้นไล่เฉด */
  .tagline {
    font-size:15px; color:rgba(255,255,255,.82);
    margin-bottom:36px; line-height:1.7;
  }

  .btn-main {
    display:inline-flex; align-items:center; gap:10px;
    /* #ff5c35 กับตัวอักษรขาวได้แค่ 3.07:1 ตัวอักษร 16px ตัวหนายังไม่นับเป็นตัวใหญ่
       จึงต้องเข้มขึ้นเป็น #e22c00 ซึ่งได้ 4.57:1 */
    background:#e22c00; color:#fff;
    padding:15px 40px; border-radius:999px;
    font-size:16px; font-weight:700;
    text-decoration:none;
    box-shadow:0 8px 28px rgba(226,44,0,.4);
    transition:transform .2s, box-shadow .2s;
  }
  .btn-main:hover { transform:translateY(-3px); box-shadow:0 14px 36px rgba(226,44,0,.5); }

  .features {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:16px; margin-top:40px;
    padding-top:32px; border-top:1px solid rgba(255,255,255,.1);
  }
  .feat-icon { font-size:26px; margin-bottom:8px; }
  .feat-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:3px; }
  .feat-sub { font-size:13px; color:rgba(255,255,255,.78); line-height:1.55; }

  .footer-note {
    margin-top:32px; font-size:13px;
    color:rgba(255,255,255,.72); line-height:1.8;
  }

  @media(max-width:520px) {
    .card { padding:36px 24px; }
    .logo { font-size:34px; }
    .features { grid-template-columns:1fr; gap:20px; }
  }
</style>
</head>
<body>
  <div class="bg-decor">
    <div class="blob1"></div>
    <div class="blob2"></div>
  </div>

  <div class="card">
    <div class="logo">Work<span>Sync</span></div>
    <p class="tagline">
      แพลตฟอร์มซื้อขายออนไลน์ที่ข้อมูลปลอดภัย<br>
      ไม่มีค่าธรรมเนียม ซื้อตรงจากผู้ขาย
    </p>

    <a href="/worksync/" class="btn-main">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      เข้าสู่เว็บไซต์
    </a>

    <div class="features">
      <div>
        <div class="feat-icon">🔒</div>
        <div class="feat-title">ข้อมูลปลอดภัย</div>
        <div class="feat-sub">ไม่รั่วไหลออกนอกระบบ</div>
      </div>
      <div>
        <div class="feat-icon">💰</div>
        <div class="feat-title">0% ค่าคอมมิชชั่น</div>
        <div class="feat-sub">ขายได้เก็บเต็ม 100%</div>
      </div>
      <div>
        <div class="feat-icon">🤝</div>
        <div class="feat-title">ยืม-คืนในชุมชน</div>
        <div class="feat-sub">แบ่งปันโดยไม่ต้องซื้อ</div>
      </div>
    </div>

    <div class="footer-note">
      โครงงาน IS · โรงเรียนอัสสัมชัญระยอง<br>
      © 2568 WorkSync
    </div>
  </div>
</body>
</html>
